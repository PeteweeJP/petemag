# Dependabot opens pull requests when the site's packages or the deploy's actions
# have updates (security fixes arrive within a day; routine updates weekly, grouped).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
