name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to exact commits so a tampered upstream release can't run here.
# The repo requires SHA pinning, including actions used *inside* other actions, so only
# upgrade to releases that pin their own internals (check the action's action.yml).
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Install exactly what package-lock.json records.
      - run: npm ci
      # Stop the deploy if any file has a type or content error.
      - run: npm run check
      - run: npm run build
      # Titles, descriptions, headings, alt text, links, JSON-LD, contrast (scripts/audit.mjs).
      - run: npm run audit
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
