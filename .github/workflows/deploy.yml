name: Check

# The live site is hosted on Cloudflare (npm run deploy, see wrangler.jsonc). This workflow no
# longer publishes anything: it checks every push to main so a broken commit is caught, and
# GitHub keeps the code as a backup. (Until 2026-10-05 it deployed to GitHub Pages.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to exact commits so a tampered upstream release can't run here.
# The repo requires SHA pinning, including actions used *inside* other actions, so only
# upgrade to releases that pin their own internals (check the action's action.yml).
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Install exactly what package-lock.json records.
      - run: npm ci
      # Type and content errors.
      - run: npm run check
      - run: npm run build
      # Titles, descriptions, headings, alt text, links, JSON-LD, contrast (scripts/audit.mjs).
      - run: npm run audit
